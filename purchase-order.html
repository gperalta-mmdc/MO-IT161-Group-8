<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProcureIT - Purchase Orders</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="dashboard.html">ProcureIT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="requisition.html">Requisitions</a></li>
          <li class="nav-item"><a class="nav-link active" href="purchase-order.html">Purchase Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="approvals.html">Approvals</a></li>
          <li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li>
          <li class="nav-item"><a class="nav-link" href="invoices.html">Invoices</a></li>
        </ul>
        <div class="d-flex align-items-center text-white">
          <span id="userRoleBadge" class="badge bg-light text-dark me-3">User Role</span>
          <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Page Header & Action Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2><i class="bi bi-file-earmark-text me-2"></i>Purchase Orders</h2>
        <p class="text-muted mb-0">Manage and track all procurement purchase orders.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createPOModal">
        <i class="bi bi-plus-lg me-1"></i> Create Purchase Order
      </button>
    </div>

    <!-- Filter Section -->
    <div class="card mb-4 shadow-sm border-0">
      <div class="card-body">
        <form id="filterForm" class="row g-3">
          <div class="col-md-4">
            <label for="searchPO" class="form-label small text-muted">Search</label>
            <input type="text" id="searchPO" class="form-control" placeholder="PO Number or Vendor name...">
          </div>
          <div class="col-md-3">
            <label for="statusFilter" class="form-label small text-muted">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All Statuses</option>
              <option value="Draft">Draft</option>
              <option value="Pending Approval">Pending Approval</option>
              <option value="Approved">Approved</option>
              <option value="Issued">Issued</option>
              <option value="Fulfilled">Fulfilled</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="dateFilter" class="form-label small text-muted">Date</label>
            <input type="date" id="dateFilter" class="form-control">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="button" id="resetFilterBtn" class="btn btn-outline-secondary w-100">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Purchase Orders Data Table -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">PO Number</th>
                <th>Vendor</th>
                <th>Created Date</th>
                <th>Total Amount</th>
                <th>Status</th>
                <th class="text-end pe-3">Actions</th>
              </tr>
            </thead>
            <tbody id="poTableBody">
              <!-- Dynamically populated by js/purchase-orders.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Purchase Order Modal -->
  <div class="modal fade" id="createPOModal" tabindex="-1" aria-labelledby="createPOModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h5 class="modal-title" id="createPOModalLabel">Create New Purchase Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="createPOForm">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="vendorSelect" class="form-label">Vendor <span class="text-danger">*</span></label>
                <select id="vendorSelect" class="form-select" required>
                  <option value="">Select Vendor...</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="requisitionSelect" class="form-label">Linked Requisition (Optional)</label>
                <select id="requisitionSelect" class="form-select">
                  <option value="">None</option>
                </select>
              </div>
            </div>

            <hr class="my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0 fw-bold">Line Items</h6>
              <button type="button" id="addItemBtn" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i> Add Line Item
              </button>
            </div>

            <!-- Items Dynamic Container -->
            <div id="itemsContainer">
              <div class="row g-2 mb-2 item-row align-items-center">
                <div class="col-md-5">
                  <input type="text" class="form-control item-desc" placeholder="Item description / name" required>
                </div>
                <div class="col-md-2">
                  <input type="number" class="form-control item-qty" placeholder="Qty" min="1" required>
                </div>
                <div class="col-md-3">
                  <input type="number" class="form-control item-price" placeholder="Unit Price ($)" step="0.01" min="0" required>
                </div>
                <div class="col-md-2 text-end">
                  <button type="button" class="btn btn-outline-danger btn-sm remove-item-btn" disabled><i class="bi bi-trash"></i></button>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" form="createPOForm" class="btn btn-primary">Save Purchase Order</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/rbac.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/purchase-orders.js"></script>
</body>
</html>
