<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProcureIT - Purchase Order Detail</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="dashboard.html">ProcureIT</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link text-white" href="purchase-order.html"><i class="bi bi-arrow-left me-1"></i> Back to Purchase Orders</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Top Header & Dynamic Action Buttons -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 id="poNumberHeading" class="mb-1">PO # Loading...</h2>
        <div><span id="poStatusBadge" class="badge bg-secondary fs-6">Status: Loading</span></div>
      </div>
      <div id="actionButtons" class="d-flex gap-2">
        <!-- Rendered dynamically by js/purchase-order-detail.js (e.g., Submit, Approve, Issue) -->
      </div>
    </div>

    <!-- Info Cards Row -->
    <div class="row g-4 mb-4">
      <!-- Vendor Information Card -->
      <div class="col-md-6">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-header bg-light fw-bold">
            <i class="bi bi-building me-2"></i>Vendor Information
          </div>
          <div class="card-body">
            <h5 id="vendorName" class="card-title text-primary">--</h5>
            <p class="mb-1 text-muted"><i class="bi bi-envelope me-2"></i><span id="vendorEmail">--</span></p>
            <p class="mb-0 text-muted"><i class="bi bi-telephone me-2"></i><span id="vendorPhone">--</span></p>
          </div>
        </div>
      </div>

      <!-- Metadata Card -->
      <div class="col-md-6">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-header bg-light fw-bold">
            <i class="bi bi-info-circle me-2"></i>Order Information
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-6 mb-3">
                <span class="text-muted d-block small">Created Date</span>
                <strong id="createdDate">--</strong>
              </div>
              <div class="col-6 mb-3">
                <span class="text-muted d-block small">Created By</span>
                <strong id="createdBy">--</strong>
              </div>
              <div class="col-6">
                <span class="text-muted d-block small">Requisition Reference</span>
                <strong id="reqReference">None</strong>
              </div>
              <div class="col-6">
                <span class="text-muted d-block small">Total Amount</span>
                <strong id="poTotalAmount" class="text-success fs-5">$0.00</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Line Items Table Card -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-light fw-bold">
        <i class="bi bi-list-check me-2"></i>Line Items Breakdown
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3" style="width: 60px;">#</th>
                <th>Description</th>
                <th class="text-end">Quantity</th>
                <th class="text-end">Unit Price</th>
                <th class="text-end pe-3">Total Price</th>
              </tr>
            </thead>
            <tbody id="lineItemsTableBody">
              <!-- Dynamically populated by js/purchase-order-detail.js -->
            </tbody>
            <tfoot>
              <tr class="table-light">
                <td colspan="4" class="text-end fw-bold py-3">Grand Total:</td>
                <td class="text-end fw-bold text-success pe-3 py-3 fs-5" id="footerGrandTotal">$0.00</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/rbac.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/purchase-order-detail.js"></script>
</body>
</html>
