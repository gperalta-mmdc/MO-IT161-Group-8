<!doctype html>

<html lang="en">
  <head>
    <title>ProcureIT - Procurement and Inventory System</title>
  </head>
  <body>
    <header>
      <p>
        Workplace Zero Paper Initiative<br />
        Procurement and Inventory Management System
      </p>
    </header>
    <table
      width="100%"
      style="height: 100vh"
      border="1"
      cellpadding="10"
      cellspacing="0"
    >
      <tr>
        <td width="50%" valign="top" bgcolor="#F1EAD2">
          <section>
            <h2>Log-In</h2>
            <p>Please enter your credentials to access the system</p>
            <form action="dashboard.html" method="get">
              <fieldset>
                <legend>Account Log-In</legend>
                <br />
                <label>Username or E-Mail</label>
                <br />
                <input
                  type="text"
                  placeholder="Enter username or email"
                  required
                />
                <br /><br />
                <label>Password</label>
                <br />
                <input type="password" placeholder="Enter password" required />
                <br /><br />
                <label>Department</label>
                <br />
                <select>
                  <option>-- Select Department --</option>
                  <option>IT</option>
                  <option>Purchasing</option>
                  <option>Accounting</option>
                  <option>Administration</option>
                </select>
                <br /><br />
                <input type="checkbox" />
                <label>Remember Me</label>
                <br /><br />
                <button type="submit">Log-In</button>
              </fieldset>
            </form>
            <p><a href="#">Forgot your password?</a></p>

            <p>
              Don't have an account?
              <a href="#">Contact your administrator</a>
            </p>
          </section>
        </td>

        <td width="50%" bgcolor="#365194" valign="top">
          <div style="text-align: center">
            <img src="./resources/proc1.jpg" alt="ProcureIT" />
          </div>
        </td>
      </tr>
    </table>
    <footer>
      <p>&copy; 2026 ProcureIT. Workplace Zero Paper Initiative Project.</p>
    </footer>
  </body>
</html>
